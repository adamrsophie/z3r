url: https://adamrsophie.github.io/z3r/

template:
  bootstrap: 5
  bslib:
    primary: "#12233F"
    navbar-bg: "#12233F"
    link-color: "#1F8A7E"
    base_font: {google: "Inter"}
    heading_font: {google: "Space Grotesk"}
    code_font: {google: "JetBrains Mono"}

home:
  title: "z3r: Native R Interface to the Z3 Theorem Prover"
  description: >
    SMT solving, optimization and every Z3 theory from R, through Z3's C API.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]

articles:
- title: Getting started
  navbar: ~
  contents:
  - z3r
  - numbers
