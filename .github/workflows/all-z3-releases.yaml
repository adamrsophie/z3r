# Runs R CMD check against every supported Z3 release (4.8.13 to 5.4.1),
# on Linux, on demand and once a month. The push workflow tests one release
# from each series; this one covers the releases between.
name: all-z3-releases

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 3 * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    name: Z3 ${{ matrix.z3 }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
