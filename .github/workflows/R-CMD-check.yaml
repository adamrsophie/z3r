# Builds the native code against a pinned Z3 on each platform and runs
# R CMD check. Z3 archives are official release assets verified by SHA-256.
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (Z3 ${{ matrix.z3 }}, R ${{ matrix.r }})
    # A solver that does not terminate fails the job instead of holding a
    # runner for six hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Principal matrix: the latest Z3 release
          - {os: ubuntu-24.04, r: release, z3: "5.4.1", asset: z3-5.4.1-x64-glibc-2.39.zip,
             sha: b548bac48ef2452b4e09ea2945cf4b011d5f43fcf39e4799df268ee7e0769d85}
          - {os: macos-15, r: release, z3: "5.4.1", asset: z3-5.4.1-arm64-osx-13.3.zip,
             sha: a4a878121e81dfc297d027dd0b51dc4f08feb4296d6ecace42bfbc87a29d6d58}
          - {os: windows-latest, r: release, z3: "5.4.1", asset: z3-5.4.1-x64-win.zip,
             sha: f16e991e1c883b0cee30c78eb445343e1a3f49c142aa7dead7d6c35f9cc44934}
          # Previous major series
          - {os: ubuntu-24.04, r: release, z3: "4.16.0", asset: z3-4.16.0-x64-glibc-2.39.zip,
             sha: 7288c49a5bd6dbafd7b0b0d1f65956b91672da24b08f09242919af159be3418e}
          - {os: windows-latest, r: release, z3: "4.16.0", asset: z3-4.16.0-x64-win.zip,
             sha: de4d813e47202394a093547dbdb5699ee076529aa853463e007539775cd7e836}
          # Oldest supported release
          - {os: ubuntu-22.04, r: release, z3: "4.8.13", asset: z3-4.8.13-x64-glibc-2.31.zip,
             sha: 32d4b88604c04cd44f44335e9ce9fa309d29b5c766e98e7b32d630c7ed2f6021}
          # Older R
          - {os: ubuntu-24.04, r: oldrel-1, z3: "5.4.1", asset: z3-5.4.1-x64-glibc-2.39.zip,
             sha: b548bac48ef2452b4e09ea2945cf4b011d5f43fcf39e4799df268ee7e0769d85}
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download pinned Z3 release
        shell: bash
        run: |
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          # Outside the checkout, so R CMD check does not see the archive.
          (
            cd "$RUNNER_TEMP"
            curl -sSL -o z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-${{ matrix.z3 }}/${{ matrix.asset }}"
            echo "${{ matrix.sha }}  z3.zip" | $sum -c -
            unzip -q z3.zip
          )
          Z3_DIR="$RUNNER_TEMP/${{ matrix.asset }}"
          Z3_DIR="${Z3_DIR%.zip}"
          if command -v cygpath > /dev/null; then Z3_DIR=$(cygpath -m "$Z3_DIR"); fi
          echo "Z3_DIR=$Z3_DIR" >> "$GITHUB_ENV"
          echo "Z3_INCLUDE_DIR=$Z3_DIR/include" >> "$GITHUB_ENV"
          echo "Z3_LIB_DIR=$Z3_DIR/bin" >> "$GITHUB_ENV"
          echo "$Z3_DIR/bin" >> "$GITHUB_PATH"

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
          error-on: '"warning"'

      - name: Show the Z3 version z3r was built with
        if: always()
        shell: Rscript {0}
        run: |
          if (requireNamespace("z3r", quietly = TRUE)) print(z3r::z3_version())

  # The distribution's Z3 (libz3-dev). Ubuntu 24.04 ships 4.8.12, below the
  # minimum, so this runs in Debian testing, which ships a supported Z3.
  system-z3:
    runs-on: ubuntu-24.04
    name: Debian testing (distribution Z3)
    timeout-minutes: 60
    container: rocker/r-base:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Z3 and R packages from Debian
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libz3-dev pkg-config pandoc qpdf \
            r-cran-rcpp r-cran-testthat r-cran-gmp r-cran-knitr r-cran-rmarkdown
      - name: Build and check
        run: |
          R CMD build .
          _R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual z3r_*.tar.gz
      - name: Show the check log
        if: failure()
        run: |
          cat z3r.Rcheck/00check.log
          cat z3r.Rcheck/tests/testthat.Rout.fail || true
