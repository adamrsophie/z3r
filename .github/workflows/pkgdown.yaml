name: pkgdown

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgdown
  cancel-in-progress: false

jobs:
  # Builds the site with a read-only token.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Ubuntu's libz3-dev (4.8.12) is too old; use the pinned official release.
      - name: Download pinned Z3 release
        shell: bash
        run: |
          asset=z3-5.4.1-x64-glibc-2.39.zip
          curl -sSL -o z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-5.4.1/$asset"
          echo "b548bac48ef2452b4e09ea2945cf4b011d5f43fcf39e4799df268ee7e0769d85  z3.zip" | shasum -a 256 -c -
          unzip -q z3.zip -d "$RUNNER_TEMP"
          Z3_DIR="$RUNNER_TEMP/${asset%.zip}"
          echo "Z3_INCLUDE_DIR=$Z3_DIR/include" >> "$GITHUB_ENV"
          echo "Z3_LIB_DIR=$Z3_DIR/bin" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: docs
          retention-days: 1

  # Only this job can write, and it runs no R code or package installs.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: docs
      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@65b5dfd4f5bcd3a7403bbc2959c144256167464e # v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
